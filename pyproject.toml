description = "Casual cold-start measurement for ruri-v3 embedding models on Modal (TEI vs Transformers+FastAPI)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "modal>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[tool.uv]
package = false
